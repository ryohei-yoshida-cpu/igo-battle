# main に push されたら、テストをして、通ったら Cloudflare Workers に公開する
# 必要な GitHub の Secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
#   ADMIN_KEY … 運営画面の合言葉（登録してあれば、Cloudflare の秘密の設定にうつす。なければ運営画面は開かない）
name: Test and Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: コードの書きまちがいチェック
        run: npm run lint
      - name: サーバーのテスト
        run: npm test
      - name: ブラウザのテスト
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_ADMIN_KEY: ${{ secrets.ADMIN_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          preCommands: npx wrangler whoami
      - name: 運営の合言葉を Cloudflare へ（GitHub の Secrets に ADMIN_KEY があるときだけ）
        if: env.HAS_ADMIN_KEY == 'true'
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$ADMIN_KEY" | npx --yes wrangler@4 secret put ADMIN_KEY
